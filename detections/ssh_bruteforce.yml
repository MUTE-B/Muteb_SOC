title: SSH Brute Force Detection

id: MUTEB-SSH-0001

status: stable

author: Muteb Albalawi

description: >
  Detect multiple failed SSH login attempts
  that may indicate a brute-force attack.

severity: High

category: Authentication

logsource:

  product: linux

  service: ssh

detection:

  selection:

    message|contains:

      - "Failed password"

      - "authentication failure"

      - "Invalid user"

  condition: selection

fields:

  - timestamp

  - hostname

  - username

  - source_ip

  - process

  - message

falsepositives:

  - User entered the wrong password.

  - Automated administrative scripts.

level: high

tags:

  - attack.t1110

  - brute_force

  - ssh

  - linux

  - soc

references:

  - https://attack.mitre.org/techniques/T1110/
privilege_escalation.yml
suspicious_login.yml
reverse_shell.yml
web_attack.yml
malware_execution.yml
