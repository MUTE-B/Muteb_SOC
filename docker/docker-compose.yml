

services:


  backend:


    build:

      context: ..

      dockerfile: docker/Dockerfile.backend


    ports:

      - "8000:8000"



  database:


    image: postgres:16


    environment:


      POSTGRES_DB:

        muteb_soc


      POSTGRES_USER:

        muteb


      POSTGRES_PASSWORD:

        change_this_password



    ports:


      - "5432:5432"



