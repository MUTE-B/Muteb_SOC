title: MUTEB SOC SSH Brute Force Detection

id: muteb-ssh-bruteforce

status: experimental

description: Detect multiple failed SSH login attempts

logsource:
  product: linux
  service: ssh


detection:

  selection:
    message|contains:
      - "Failed password"


  condition:
    selection


level: high

tags:
  - attack.credential_access
  - attack.t1110

