title: SSH Brute Force Detection

id: MUTEB-SIGMA-001

status: experimental

description:
Detect multiple failed SSH authentication attempts


logsource:

    product: linux
    service: ssh


detection:

    selection:

        message|contains:
            - "Failed password"
            - "authentication failure"


    condition:

        selection


level:

    high


tags:

    - attack.credential_access
    - attack.t1110

