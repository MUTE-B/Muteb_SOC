version: "3.9"

services:

 backend:

  build: .

  container_name: muteb-soc-backend

  ports:
   - "8000:8000"

  env_file:
   - .env

  restart: always


 frontend:

  image: node:20

  container_name: muteb-soc-frontend

  working_dir: /frontend

  volumes:
   - ./frontend:/frontend

  ports:
   - "5173:5173"

  command:
   npm run dev -- --host 0.0.0.0

  restart: always

