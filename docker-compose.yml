

services:


  backend:


    build:

      context: ./backend


    container_name: muteb-soc-backend


    restart: always


    ports:

      - "8000:8000"


    volumes:

      - ./backend/logs:/app/logs

      - ./backend/reports:/app/reports


    environment:

      - FLASK_ENV=production


    healthcheck:


      test:

        [

        "CMD",

        "python",

        "-c",

        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"

        ]


      interval: 30s

      timeout: 10s

      retries: 5






  nginx:


    image: nginx:latest


    container_name: muteb-soc-nginx


    restart: always


    ports:

      - "80:80"


    volumes:


      - ./frontend/dist:/usr/share/nginx/html

      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf


    depends_on:


      backend:


        condition: service_healthy



