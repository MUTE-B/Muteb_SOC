# =====================================================
# Muteb SOC Detection Rule
#
# Name:
# Privilege Escalation Detection
#
# Purpose:
# Detect suspicious attempts to gain higher privileges
#
# Log Source:
# Linux Authentication Logs
# =====================================================



rule:


  name:
    Privilege Escalation Attempt



  description:
    Detect unauthorized privilege elevation activities



  severity:
    High



  category:
    Privilege Abuse



  log_source:


    files:


      - /var/log/auth.log

      - /var/log/secure



  detection:


    events:


      sudo_usage:


        keywords:


          - sudo


          - authentication failure



      root_access:


        keywords:


          - su root


          - session opened for user root



  threshold:


    attempts:
      3


    timeframe:
      10 minutes



  response:


    actions:


      - Review User Permissions


      - Check Command History


      - Investigate User Activity


      - Disable Suspicious Account If Required
# =====================================================
# Muteb SOC Detection Rule
#
# Name:
# Privilege Escalation Detection
#
# الهدف:
# اكتشاف محاولات رفع الصلاحيات
# داخل نظام Linux
#
# الاستخدام:
# SOC Monitoring
# Linux Security Monitoring
# =====================================================



rule:


  name:

    Privilege Escalation Detection





  description:


    Detect suspicious privilege escalation
    activities on Linux systems.





  severity:


    Critical





  log_source:


    Linux Authentication Logs





  detection:


    conditions:


      - sudo_command_executed


      - root_shell_created


      - user_added_to_admin_group


      - sensitive_file_modified





  monitored_files:


    - /etc/passwd

    - /etc/shadow

    - /etc/sudoers





  response:


    actions:


      - Create Critical Alert

      - Disable Suspicious Account

      - Start Incident Investigation
