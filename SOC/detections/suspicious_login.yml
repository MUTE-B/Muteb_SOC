# =====================================================
# Muteb SOC Detection Rule
#
# Name:
# Suspicious Login Detection
#
# Purpose:
# Detect unusual authentication activity
# =====================================================



rule:


  name:
    Suspicious User Login



  description:
    Detect login activity requiring investigation



  severity:
    Medium



  category:
    Authentication Monitoring



  detection:


    events:


      successful_login:

        keyword:
          Accepted password



      unusual_source:

        condition:
          Unknown IP Address



  response:


    actions:


      - Verify User Identity

      - Check Login Location

      - Review User Activity
# =====================================================
# Muteb SOC Detection Rule
#
# Name:
# Suspicious Login Detection
#
# الهدف:
# اكتشاف عمليات الدخول غير الطبيعية
# =====================================================



rule:


  name:

    Suspicious Login Detection



  description:


    Detect unusual user authentication activity.





  severity:


    Medium





  log_source:


    Linux Authentication Logs





  detection:


    conditions:


      - root_login

      - unknown_source

      - unusual_time





  response:


    actions:


      - Create Alert

      - Verify User Activity

      - Check Login Source
