

name: MUTEB SOC Security Pipeline



on:

  workflow_dispatch:

  push:

    branches:

      - main





jobs:



 security:



  runs-on: ubuntu-latest



  steps:



   - uses: actions/checkout@v4



   - name: Python Security Audit

     run: |


       pip install bandit


       bandit -r backend -f txt || true





   - name: Dependency Audit

     run: |


       pip install pip-audit


       pip-audit || true





