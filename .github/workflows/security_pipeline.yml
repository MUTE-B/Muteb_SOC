

name: MUTEB Security Pipeline


on:

  push:

    branches:

      - main



jobs:


  security-check:


    runs-on: ubuntu-latest


    steps:


      - name: Checkout

        uses: actions/checkout@v4



      - name: Python Check

        uses: actions/setup-python@v5

        with:

          python-version: "3.13"



      - name: Validate

        run: |

          python --version



