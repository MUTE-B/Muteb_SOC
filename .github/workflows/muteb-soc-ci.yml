
name: MUTEB SOC Enterprise CI


on:

  push:

    branches:
      - main


  pull_request:

    branches:
      - main



jobs:


  security-platform-test:


    runs-on: ubuntu-latest



    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: Python Setup

      uses: actions/setup-python@v5

      with:

        python-version: "3.12"



    - name: Install Dependencies

      run: |

        pip install -r requirements.txt



    - name: Syntax Check

      run: |

        python -m py_compile app/core/application.py



    - name: Route Test

      run: |

        python - <<'PY'

        from app.core.application import create_app

        app=create_app()

        print("MUTEB SOC CI OK")

        print(len(list(app.url_map.iter_rules())),"Routes")

        PY

